<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MVP 부모유형 진단</title>
  <meta name="description" content="10개의 질문으로 나의 육아 성향을 알아보세요. 공감형, 훈육형, 자율형, 균형형 중 나는 어떤 부모 유형일까요?" />
  <!-- Open Graph / KakaoTalk Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="MVP 부모유형 진단" />
  <meta property="og:description" content="10개의 질문으로 나의 육아 성향을 알아보세요. 공감형, 훈육형, 자율형, 균형형 중 나는 어떤 부모 유형일까요?" />
  <meta property="og:url" content="https://kimchulhee9-ux.github.io/mvp/" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👨‍👩‍👧</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #ff9f43;
      --primary-dark: #ff7f50;
      --bg: #fff8ef;
      --bg2: #fffdf9;
      --card-bg: rgba(255, 255, 255, 0.96);
      --result-bg: #fff3e6;
      --border: #ffd9b3;
      --text-dark: #352824;
      --text-mid: #6b4b3f;
      --text-body: #2f2f3a;
      --brand: #9b7d67;
      --shadow: rgba(130, 78, 32, 0.12);
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 60%, #fff 100%);
      min-height: 100vh;
      color: var(--text-body);
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 100px;
    }

    /* ── HERO ─────────────────────────────── */
    .hero {
      padding: 20px 6px 10px;
    }

    .hero-title {
      font-size: 2.45rem;
      font-weight: 900;
      color: var(--text-dark);
      line-height: 1.18;
      letter-spacing: -0.04em;
    }

    .hero-brand {
      text-align: center;
      margin: 10px 0 18px;
      font-size: 1rem;
      font-style: italic;
      font-weight: 600;
      color: var(--brand);
      letter-spacing: 6px;
    }

    .hero-subtitle {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-mid);
      line-height: 1.45;
      margin-top: 18px;
    }

    /* ── CARDS ────────────────────────────── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 30px var(--shadow);
      margin: 18px 0;
      line-height: 1.7;
    }

    .result-card {
      background: var(--result-bg);
      border: 1px solid #ffd0a1;
      border-radius: 26px;
      padding: 26px;
      box-shadow: 0 12px 34px var(--shadow);
      margin: 18px 0;
    }

    .result-emoji {
      font-size: 3rem;
      margin-bottom: 10px;
      display: block;
    }

    .result-title {
      font-size: 1.75rem;
      font-weight: 900;
      color: var(--text-dark);
      line-height: 1.3;
    }

    .result-summary {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--text-mid);
      line-height: 1.6;
      margin-top: 10px;
    }

    .result-desc {
      margin-top: 12px;
      color: var(--text-body);
      line-height: 1.7;
    }

    .mini-card h3 {
      font-size: 1rem;
      font-weight: 900;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .mini-card p {
      font-size: 0.97rem;
      color: var(--text-body);
      line-height: 1.65;
    }

    /* ── QUESTION ─────────────────────────── */
    .question-label {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--text-dark);
      margin-bottom: 14px;
    }

    .question-text {
      font-size: 1.18rem;
      font-weight: 800;
      color: var(--text-body);
      line-height: 1.5;
      letter-spacing: -0.03em;
    }

    /* ── PROGRESS ─────────────────────────── */
    .progress-wrap {
      margin: 18px 0 6px;
    }

    .progress-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-mid);
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 8px;
      background: #fddcbf;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-dark));
      border-radius: 99px;
      transition: width 0.4s cubic-bezier(.4, 0, .2, 1);
    }

    /* ── RADIO ────────────────────────────── */
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border: 2px solid #ffd9b3;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      background: #fff;
      font-size: 0.97rem;
      font-weight: 600;
      color: var(--text-body);
      user-select: none;
    }

    .radio-option:hover {
      border-color: var(--primary);
      background: #fff8f0;
      transform: translateY(-1px);
    }

    .radio-option.selected {
      border-color: var(--primary-dark);
      background: linear-gradient(135deg, #fff4e8, #ffe8cc);
      color: var(--text-dark);
    }

    .radio-circle {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border: 2px solid #ffd9b3;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .radio-option.selected .radio-circle {
      border-color: var(--primary-dark);
      background: var(--primary-dark);
    }

    .radio-circle::after {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: white;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .radio-option.selected .radio-circle::after {
      opacity: 1;
    }

    /* ── BUTTONS ──────────────────────────── */
    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      min-height: 52px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      font-size: 1.02rem;
      font-weight: 800;
      font-family: 'Noto Sans KR', sans-serif;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 4px 16px rgba(255, 127, 80, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(255, 127, 80, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: white;
      color: var(--text-mid);
      border: 2px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary-dark);
      background: #fff8f0;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-outline {
      background: white;
      color: var(--text-mid);
      border: 2px solid var(--border);
      width: 100%;
      min-height: 52px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 800;
      font-family: 'Noto Sans KR', sans-serif;
      transition: all 0.2s;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary-dark);
      background: #fff8f0;
    }

    /* ── CHART ────────────────────────────── */
    .chart-wrap {
      margin: 8px 0;
    }

    .chart-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .chart-label {
      font-size: 0.93rem;
      font-weight: 700;
      color: var(--text-mid);
      width: 60px;
      flex-shrink: 0;
    }

    .chart-bar-bg {
      flex: 1;
      height: 20px;
      background: #fddcbf;
      border-radius: 99px;
      overflow: hidden;
    }

    .chart-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-dark));
      border-radius: 99px;
      transition: width 1s cubic-bezier(.4, 0, .2, 1);
    }

    .chart-value {
      font-size: 0.93rem;
      font-weight: 800;
      color: var(--text-dark);
      width: 28px;
      text-align: right;
    }

    /* ── SHARE ────────────────────────────── */
    .share-box {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .share-url {
      flex: 1;
      font-size: 0.88rem;
      color: var(--text-mid);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .copy-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      font-family: 'Noto Sans KR', sans-serif;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      transform: scale(1.04);
    }

    /* ── TOAST ────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #352824;
      color: white;
      padding: 12px 24px;
      border-radius: 99px;
      font-size: 0.9rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
      z-index: 9999;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── TYPE BADGES (home) ───────────────── */
    .type-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .type-badge {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      cursor: default;
    }

    .type-badge-emoji {
      font-size: 1.6rem;
      margin-bottom: 4px;
    }

    .type-badge-name {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-dark);
    }

    .type-badge-desc {
      font-size: 0.78rem;
      color: var(--text-mid);
      margin-top: 4px;
      line-height: 1.4;
    }

    /* ── ANIMATIONS ───────────────────────── */
    .fade-in {
      animation: fadeIn 0.45s ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── RESPONSIVE ───────────────────────── */
    @media (max-width: 600px) {
      .container {
        padding: 18px 16px 80px;
      }

      .hero-title {
        font-size: 1.85rem;
      }

      .hero-brand {
        font-size: 0.85rem;
        letter-spacing: 4px;
      }

      .hero-subtitle {
        font-size: 1.02rem;
      }

      .card,
      .result-card {
        padding: 18px;
        border-radius: 20px;
      }

      .question-label {
        font-size: 1.1rem;
      }

      .question-text {
        font-size: 1.02rem;
      }

      .result-title {
        font-size: 1.45rem;
      }

      .result-summary {
        font-size: 0.98rem;
      }

      .type-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* ─── AUTH / PIN CODE (IMAGE 2 STYLE) ─── */
    .auth-wrap {
      max-width: 360px;
      margin: 10px auto 0;
      text-align: center;
    }

    .auth-graphic-card {
      background: linear-gradient(180deg, #ffffff 0%, #fff9f5 100%);
      border-radius: 28px;
      padding: 20px 18px 18px;
      box-shadow: 0 14px 34px rgba(240, 110, 50, 0.09);
      margin: 14px auto 22px;
      border: 1.5px solid #ffe3d5;
      max-width: 290px;
    }

    .auth-illustration {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 6px;
      animation: float 3.2s ease-in-out infinite;
    }

    .auth-illustration svg {
      width: 156px;
      height: 116px;
      display: block;
      filter: drop-shadow(0 4px 10px rgba(255, 120, 80, 0.12));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .auth-title-tag {
      font-weight: 900;
      font-size: 1.15rem;
      color: #3e261a;
      letter-spacing: 1px;
    }

    .auth-subtag {
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ff7b54;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .auth-prompt {
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 20px;
    }

    .pin-container {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 28px;
    }

    .pin-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2.5px solid #d8c2b0;
      background: transparent;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .pin-dot.filled {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
      transform: scale(1.2);
      box-shadow: 0 0 14px rgba(255, 127, 80, 0.45);
    }

    .pin-dot.error {
      background: #ff5252 !important;
      border-color: #ff5252 !important;
      box-shadow: 0 0 14px rgba(255, 82, 82, 0.5) !important;
    }

    .pin-container.shake {
      animation: shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      max-width: 320px;
      margin: 0 auto;
    }

    .keypad-btn {
      height: 58px;
      border-radius: 29px;
      border: none;
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(130, 78, 32, 0.08);
      font-size: 1.45rem;
      font-weight: 800;
      font-family: inherit;
      color: var(--text-dark);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .keypad-btn:hover {
      background: #fff8f0;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(130, 78, 32, 0.14);
    }

    .keypad-btn:active {
      transform: scale(0.92);
      background: #ffe8cc;
    }

    .keypad-btn.action-btn {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-mid);
      background: #faf4ed;
    }

    /* ─── HOME (IMAGE 1 STYLE) ───────────── */
    .venn-graphic {
      position: relative;
      width: 220px;
      height: 170px;
      margin: 14px auto 24px;
    }

    .venn-circle {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      mix-blend-mode: multiply;
      opacity: 0.72;
    }

    .venn-1 {
      top: 5px;
      left: 20px;
      background: #ff7b90;
    }

    .venn-2 {
      top: 5px;
      right: 20px;
      background: #7a9efe;
    }

    .venn-3 {
      bottom: 5px;
      left: 55px;
      background: #d88bf0;
    }

    .name-input-wrap {
      max-width: 380px;
      margin: 18px auto 16px;
      text-align: center;
    }

    .name-input-label {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 10px;
      display: block;
    }

    .name-input {
      width: 100%;
      height: 52px;
      border-radius: 16px;
      border: 2px solid var(--border);
      background: #fff;
      font-size: 1.05rem;
      font-family: inherit;
      font-weight: 700;
      color: var(--text-dark);
      text-align: center;
      padding: 0 16px;
      outline: none;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(130, 78, 32, 0.05);
    }

    .name-input:focus {
      border-color: var(--primary-dark);
      box-shadow: 0 0 0 4px rgba(255, 127, 80, 0.18);
    }

    .info-summary-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px 20px;
      max-width: 290px;
      margin: 16px auto 26px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(130, 78, 32, 0.05);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-mid);
    }

    .info-summary-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* ─── PRINT / PDF STYLES ──────────────── */
    @media print {
      @page {
        margin: 12mm;
        size: A4 portrait;
      }
      body {
        background: #fff !important;
        color: #1a1a1a !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .container {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      /* 인쇄 시 불필요한 상호작용 버튼 및 팝업 숨기기 */
      #share-card,
      .share-box,
      #btn-pdf,
      .btn-row,
      #toast,
      #btn-sheet-setting,
      #sheet-saved-badge,
      .type-grid {
        display: none !important;
      }
      .card,
      .result-card,
      .mini-card {
        box-shadow: none !important;
        border: 1px solid #e0d0c0 !important;
        background: #fffdf9 !important;
        margin: 12px 0 !important;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .chart-bar-bg {
        border: 1px solid #e2d2c2 !important;
        background: #f0e6dc !important;
      }
      .chart-bar-fill {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>

<body>
  <div class="container" id="app"></div>
  <div class="toast" id="toast"></div>

  <script>
    // ─── GOOGLE SHEET CONFIG ─────────────────────────────────────────────────────
    // 구글 스프레드시트 Apps Script 웹 앱 URL (배포 후 발급받은 URL)
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbxf39hJihNnUAvORbrwwMN1J77EpiUEXmhz1Htgs0SMNtCc30HxxehtJRY9VeL05ZR0/exec";

    function getGoogleSheetUrl() {
      return GOOGLE_SHEET_URL || localStorage.getItem("google_sheet_url") || "";
    }

    function saveResultToGoogleSheet(scores, primaryType, secondaryType) {
      const endpoint = getGoogleSheetUrl();
      if (!endpoint || state.savedToSheet) return;

      state.savedToSheet = true;

      const r1 = RESULTS[primaryType] || {};
      const r2 = RESULTS[secondaryType] || {};
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      const payload = {
        timestamp: new Date().toLocaleString("ko-KR", { timeZone: "Asia/Seoul" }),
        name: state.userName || "익명",
        primaryType: `${r1.name || primaryType} ${r1.emoji || ""}`.trim(),
        secondaryType: `${r2.name || secondaryType} ${r2.emoji || ""}`.trim(),
        scoreA: scores.A || 0,
        scoreB: scores.B || 0,
        scoreC: scores.C || 0,
        scoreD: scores.D || 0,
        device: isMobile ? "모바일" : "PC",
        responses: state.responses,
      };

      try {
        fetch(endpoint, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
        }).then(() => {
          console.log("구글 시트 저장 요청 완료");
          const badge = document.getElementById("sheet-saved-badge");
          if (badge) badge.style.display = "inline-block";
        }).catch(err => {
          console.warn("구글 시트 전송 실패:", err);
        });
      } catch (e) {

    <div class="card">
      <div class="question-label">${q.icon} Q${q.id}</div>
      <div class="question-text">${q.text}</div>

      <div class="radio-group" id="radio-group">
        ${Object.entries(SCALE).map(([v, label]) => `
          <div class="radio-option ${cur == v ? "selected" : ""}" data-value="${v}">
            <div class="radio-circle"></div>
            <span>${v} &nbsp;—&nbsp; ${label}</span>
          </div>
        `).join("")}
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="btn-prev" ${idx === 0 ? "disabled" : ""}>← 이전</button>
      <button class="btn btn-primary" id="btn-next">
        ${idx < total - 1 ? "다음 →" : "결과 보기 🎉"}
      </button>
    </div>
  </div>`;
    }

    // ─── RESULT PAGE ──────────────────────────────────────────────────────────────
    function calcScores() {
      const scores = { A: 0, B: 0, C: 0, D: 0 };
      QUESTIONS.forEach(q => { scores[q.type] += (state.responses[q.id] || 3); });
      return scores;
    }

    function analyzeType(scores) {
      const max = Math.max(...Object.values(scores));
      const tops = Object.keys(scores).filter(k => scores[k] === max);
      return tops.length > 1 ? "D" : tops[0];
    }

    function renderResult() {
      const scores = calcScores();
      const type = analyzeType(scores);
      const r = RESULTS[type];
      const maxScore = QUESTIONS.length * 5;

      // second type
      const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
      const secondType = sorted[1][0] !== type ? sorted[1][0] : sorted[0][0];
      const r2 = RESULTS[secondType];

      const appUrl = window.location.href.split("?")[0];

      // 구글 스프레드시트에 결과 자동 전송 (설정된 경우)
      saveResultToGoogleSheet(scores, type, secondType);

      return `
  <div class="fade-in">
    <div class="result-card">
      ${state.userName ? `<div style="font-size:1rem;font-weight:800;color:var(--primary-dark);margin-bottom:6px">👨‍👩‍👧 ${state.userName} 님의 부모유형</div>` : ""}
      <span class="result-emoji">${r.emoji}</span>
      <div class="result-title">${r.name}</div>
      <div class="result-summary">${r.summary}</div>
      <div class="result-desc">${r.description}</div>
    </div>

    <div class="card">
      <h3 style="font-size:1rem;font-weight:900;color:var(--text-dark);margin-bottom:16px">📊 유형별 점수</h3>
      <div class="chart-wrap">
        ${[
          { k: "A", label: "공감형" },
          { k: "B", label: "훈육형" },
          { k: "C", label: "자율형" },
          { k: "D", label: "균형형" },
        ].map(item => {
          const pct = Math.round((scores[item.k] / maxScore) * 100);
          return `
          <div class="chart-row">
            <div class="chart-label">${RESULTS[item.k].emoji} ${item.label}</div>
            <div class="chart-bar-bg">
              <div class="chart-bar-fill" style="width:${pct}%;background:linear-gradient(90deg,${RESULTS[item.k].color},${RESULTS[item.k].color}99)"></div>
            </div>
            <div class="chart-value">${scores[item.k]}</div>
          </div>`;
        }).join("")}
      </div>
    </div>

    <div class="card mini-card">
      <h3>✅ 강점</h3><p>${r.strength}</p>
    </div>
    <div class="card mini-card">
      <h3>🔎 보완점</h3><p>${r.weakness}</p>
    </div>
    <div class="card mini-card">
      <h3>🌿 추천 육아 방법</h3><p>${r.recommendation}</p>
    </div>
    <div class="card mini-card">
      <h3>💬 추천 대화 문장</h3><p><b>${r.talk}</b></p>
    </div>

    <div class="card">
      <h3 style="font-size:1rem;font-weight:900;color:var(--text-dark);margin-bottom:6px">🔀 두 번째 성향</h3>
      <p style="font-size:0.95rem;color:var(--text-mid)">
        ${state.userName ? `<b>${state.userName}</b> 님은 ` : "당신은 "}<b>${r.name}</b>이지만, <b>${r2.emoji} ${r2.name}</b> 성향도 함께 갖고 있습니다.
      </p>
    </div>

    <div class="card" id="share-card">
      <h3 style="font-size:1rem;font-weight:900;color:var(--text-dark);margin-bottom:10px">📤 결과 공유 및 저장</h3>
      <div class="share-box">
        <span class="share-url" id="share-url-text">${appUrl}</span>
        <button class="copy-btn" id="btn-copy">🔗 링크 복사</button>
      </div>
      <button class="btn-outline" id="btn-pdf" style="width:100%;margin-top:10px;font-weight:700">📄 결과 PDF 저장 / 인쇄</button>
    </div>

    <div class="btn-row" style="margin-top:20px">
      <button class="btn btn-secondary" id="btn-home">처음으로</button>
      <button class="btn btn-primary" id="btn-retry">다시 검사하기</button>
    </div>

    <div style="text-align:center;margin-top:24px;padding-top:14px;border-top:1px dashed var(--border);font-size:0.84rem;color:var(--text-mid)">
      <span id="sheet-saved-badge" style="display:none;color:#2e7d32;font-weight:700;margin-right:8px">🟢 구글 시트 저장 완료</span>
      <button id="btn-sheet-setting" style="background:none;border:none;color:var(--brand);font-size:0.83rem;text-decoration:underline;cursor:pointer;font-family:inherit">📊 구글 시트 연동 설정</button>
    </div>
  </div>`;
    }

    // ─── EVENTS ───────────────────────────────────────────────────────────────────
    function attachEvents() {
      // AUTH (참여코드 4자리 입력)
      if (state.page === "auth") {
        document.querySelectorAll(".keypad-btn[data-key]").forEach(btn => {
          btn.addEventListener("click", () => {
            inputPin(btn.dataset.key);
          });
        });

        const btnPinClear = document.getElementById("btn-pin-clear");
        if (btnPinClear) btnPinClear.addEventListener("click", clearPin);

        const btnPinDel = document.getElementById("btn-pin-del");
        if (btnPinDel) btnPinDel.addEventListener("click", deletePin);

        if (!window._authKeyHandlerAttached) {
          window._authKeyHandlerAttached = true;
          window.addEventListener("keydown", (e) => {
            if (state.page !== "auth") return;
            if (e.key >= "0" && e.key <= "9") {
              inputPin(e.key);
            } else if (e.key === "Backspace") {
              deletePin();
            } else if (e.key === "Escape") {
              clearPin();
            }
          });
        }
        return;
      }

      // HOME
      const btnStart = document.getElementById("btn-start");
      if (btnStart) {
        btnStart.addEventListener("click", () => {
          const nameInput = document.getElementById("user-name");
          if (nameInput) {
            const val = nameInput.value.trim();
            state.userName = val;
            if (val) localStorage.setItem("parent_test_name", val);
          }
          state.page = "test";
          state.currentQ = 0;
          render();
        });
      }

      const nameInput = document.getElementById("user-name");
      if (nameInput) {
        nameInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && btnStart) {
            btnStart.click();
          }
        });
      }

      // TEST – radio
      document.querySelectorAll(".radio-option").forEach(el => {
        el.addEventListener("click", () => {
          const q = QUESTIONS[state.currentQ];
          state.responses[q.id] = parseInt(el.dataset.value);
          document.querySelectorAll(".radio-option").forEach(o => o.classList.remove("selected"));
          el.classList.add("selected");
        });
      });

      const btnPrev = document.getElementById("btn-prev");
      if (btnPrev) btnPrev.addEventListener("click", () => {
        if (state.currentQ > 0) { state.currentQ--; render(); }
      });

      const btnNext = document.getElementById("btn-next");
      if (btnNext) btnNext.addEventListener("click", () => {
        const q = QUESTIONS[state.currentQ];
        if (!state.responses[q.id]) state.responses[q.id] = 3;
        if (state.currentQ < QUESTIONS.length - 1) {
          state.currentQ++; render();
        } else {
          state.page = "result"; render();
        }
      });

      // RESULT
      const btnHome = document.getElementById("btn-home");
      const btnRetry = document.getElementById("btn-retry");
      if (btnHome) btnHome.addEventListener("click", () => { resetState(); render(); });
      if (btnRetry) btnRetry.addEventListener("click", () => { resetState(); state.page = "test"; render(); });

      const btnCopy = document.getElementById("btn-copy");
      if (btnCopy) btnCopy.addEventListener("click", () => {
        const url = window.location.href.split("?")[0];
        copyToClipboard(url, "📋 링크가 복사되었습니다!");
      });

      const btnPdf = document.getElementById("btn-pdf");
      if (btnPdf) btnPdf.addEventListener("click", generatePDF);

      // 구글 시트 연동 설정 버튼
      const btnSheetSetting = document.getElementById("btn-sheet-setting");
      if (btnSheetSetting) {
        btnSheetSetting.addEventListener("click", () => {
          const currentUrl = getGoogleSheetUrl();
          const input = prompt(
            "구글 스프레드시트 Apps Script 웹 앱 URL을 입력하세요:\n(예: https://script.google.com/macros/s/.../exec)\n\n※ 빈칸으로 두고 확인을 누르면 저장된 설정이 삭제됩니다.",
            currentUrl
          );
          if (input !== null) {
            if (input.trim()) {
              localStorage.setItem("google_sheet_url", input.trim());
              showToast("📊 구글 시트 연동 URL이 저장되었습니다!");
              if (state.page === "result" && !state.savedToSheet) {
                const scores = calcScores();
                const type = analyzeType(scores);
                const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
                const secondType = sorted[1][0] !== type ? sorted[1][0] : sorted[0][0];
                saveResultToGoogleSheet(scores, type, secondType);
              }
            } else {
              localStorage.removeItem("google_sheet_url");
              showToast("구글 시트 연동 설정이 초기화되었습니다.");
            }
          }
        });
      }
    }

    function resetState() {
      state.page = "home"; state.responses = {}; state.currentQ = 0; state.savedToSheet = false;
    }

    // ─── TOAST ───────────────────────────────────────────────────────────────────
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    function copyToClipboard(text, successToast = "📋 링크가 복사되었습니다!") {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(successToast)).catch(() => {
          fallbackClipboard(text, successToast);
        });
      } else {
        fallbackClipboard(text, successToast);
      }
    }

    function fallbackClipboard(text, successToast) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      ta.style.top = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        showToast(successToast);
      } catch (e) {
        showToast("❌ 복사에 실패했습니다.");
      }
      document.body.removeChild(ta);
    }

    // ─── PDF (100% 모바일/PC 호환 브라우저 인쇄/PDF 저장) ────────────────────────
    function generatePDF() {
      showToast("📄 PDF 저장 / 인쇄 화면으로 이동합니다.");
      setTimeout(() => {
        window.print();
      }, 350);
    }

    // ─── INIT ─────────────────────────────────────────────────────────────────────
    render();
  </script>
</body>

</html>
