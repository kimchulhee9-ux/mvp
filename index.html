<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MVP 부모유형 진단</title>
  <meta name="description" content="10개의 질문으로 나의 육아 성향을 알아보세요. 공감형, 훈육형, 자율형, 균형형 중 나는 어떤 부모 유형일까요?" />
  <!-- Open Graph / KakaoTalk Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="MVP 부모유형 진단" />
  <meta property="og:description" content="10개의 질문으로 나의 육아 성향을 알아보세요. 공감형, 훈육형, 자율형, 균형형 중 나는 어떤 부모 유형일까요?" />
  <meta property="og:url" content="https://kimchulhee9-ux.github.io/mvp/" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👨‍👩‍👧</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap"
    rel="stylesheet" />
  <!-- Kakao JavaScript SDK -->
  <script src="https://t1.kakaodn.net/kakao_js_sdk/2.7.4/kakao.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #ff9f43;
      --primary-dark: #ff7f50;
      --bg: #fff8ef;
      --bg2: #fffdf9;
      --card-bg: rgba(255, 255, 255, 0.96);
      --result-bg: #fff3e6;
      --border: #ffd9b3;
      --text-dark: #352824;
      --text-mid: #6b4b3f;
      --text-body: #2f2f3a;
      --brand: #9b7d67;
      --shadow: rgba(130, 78, 32, 0.12);
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 60%, #fff 100%);
      min-height: 100vh;
      color: var(--text-body);
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 100px;
    }

    /* ── HERO ─────────────────────────────── */
    .hero {
      padding: 20px 6px 10px;
    }

    .hero-title {
      font-size: 2.45rem;
      font-weight: 900;
      color: var(--text-dark);
      line-height: 1.18;
      letter-spacing: -0.04em;
    }

    .hero-brand {
      text-align: center;
      margin: 10px 0 18px;
      font-size: 1rem;
      font-style: italic;
      font-weight: 600;
      color: var(--brand);
      letter-spacing: 6px;
    }

    .hero-subtitle {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-mid);
      line-height: 1.45;
      margin-top: 18px;
    }

    /* ── CARDS ────────────────────────────── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 30px var(--shadow);
      margin: 18px 0;
      line-height: 1.7;
    }

    .result-card {
      background: var(--result-bg);
      border: 1px solid #ffd0a1;
      border-radius: 26px;
      padding: 26px;
      box-shadow: 0 12px 34px var(--shadow);
      margin: 18px 0;
    }

    .result-emoji {
      font-size: 3rem;
      margin-bottom: 10px;
      display: block;
    }

    .result-title {
      font-size: 1.75rem;
      font-weight: 900;
      color: var(--text-dark);
      line-height: 1.3;
    }

    .result-summary {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--text-mid);
      line-height: 1.6;
      margin-top: 10px;
    }

    .result-desc {
      margin-top: 12px;
      color: var(--text-body);
      line-height: 1.7;
    }

    .mini-card h3 {
      font-size: 1rem;
      font-weight: 900;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .mini-card p {
      font-size: 0.97rem;
      color: var(--text-body);
      line-height: 1.65;
    }

    /* ── QUESTION ─────────────────────────── */
    .question-label {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--text-dark);
      margin-bottom: 14px;
    }

    .question-text {
      font-size: 1.18rem;
      font-weight: 800;
      color: var(--text-body);
      line-height: 1.5;
      letter-spacing: -0.03em;
    }

    /* ── PROGRESS ─────────────────────────── */
    .progress-wrap {
      margin: 18px 0 6px;
    }

    .progress-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-mid);
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 8px;
      background: #fddcbf;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-dark));
      border-radius: 99px;
      transition: width 0.4s cubic-bezier(.4, 0, .2, 1);
    }

    /* ── RADIO ────────────────────────────── */
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border: 2px solid #ffd9b3;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      background: #fff;
      font-size: 0.97rem;
      font-weight: 600;
      color: var(--text-body);
      user-select: none;
    }

    .radio-option:hover {
      border-color: var(--primary);
      background: #fff8f0;
      transform: translateY(-1px);
    }

    .radio-option.selected {
      border-color: var(--primary-dark);
      background: linear-gradient(135deg, #fff4e8, #ffe8cc);
      color: var(--text-dark);
    }

    .radio-circle {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border: 2px solid #ffd9b3;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .radio-option.selected .radio-circle {
      border-color: var(--primary-dark);
      background: var(--primary-dark);
    }

    .radio-circle::after {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: white;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .radio-option.selected .radio-circle::after {
      opacity: 1;
    }

    /* ── BUTTONS ──────────────────────────── */
    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      min-height: 52px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      font-size: 1.02rem;
      font-weight: 800;
      font-family: 'Noto Sans KR', sans-serif;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 4px 16px rgba(255, 127, 80, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(255, 127, 80, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: white;
      color: var(--text-mid);
      border: 2px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary-dark);
      background: #fff8f0;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-outline {
      background: white;
      color: var(--text-mid);
      border: 2px solid var(--border);
      width: 100%;
      min-height: 52px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 800;
      font-family: 'Noto Sans KR', sans-serif;
      transition: all 0.2s;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary-dark);
      background: #fff8f0;
    }

    /* ── CHART ────────────────────────────── */
    .chart-wrap {
      margin: 8px 0;
    }

    .chart-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .chart-label {
      font-size: 0.93rem;
      font-weight: 700;
      color: var(--text-mid);
      width: 60px;
      flex-shrink: 0;
    }

    .chart-bar-bg {
      flex: 1;
      height: 20px;
      background: #fddcbf;
      border-radius: 99px;
      overflow: hidden;
    }

    .chart-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-dark));
      border-radius: 99px;
      transition: width 1s cubic-bezier(.4, 0, .2, 1);
    }

    .chart-value {
      font-size: 0.93rem;
      font-weight: 800;
      color: var(--text-dark);
      width: 28px;
      text-align: right;
    }

    /* ── SHARE ────────────────────────────── */
    .share-box {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .share-url {
      flex: 1;
      font-size: 0.88rem;
      color: var(--text-mid);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .copy-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      font-family: 'Noto Sans KR', sans-serif;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      transform: scale(1.04);
    }

    /* ── TOAST ────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #352824;
      color: white;
      padding: 12px 24px;
      border-radius: 99px;
      font-size: 0.9rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
      z-index: 9999;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── TYPE BADGES (home) ───────────────── */
    .type-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .type-badge {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      cursor: default;
    }

    .type-badge-emoji {
      font-size: 1.6rem;
      margin-bottom: 4px;
    }

    .type-badge-name {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-dark);
    }

    .type-badge-desc {
      font-size: 0.78rem;
      color: var(--text-mid);
      margin-top: 4px;
      line-height: 1.4;
    }

    /* ── ANIMATIONS ───────────────────────── */
    .fade-in {
      animation: fadeIn 0.45s ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── RESPONSIVE ───────────────────────── */
    @media (max-width: 600px) {
      .container {
        padding: 18px 16px 80px;
      }

      .hero-title {
        font-size: 1.85rem;
      }

      .hero-brand {
        font-size: 0.85rem;
        letter-spacing: 4px;
      }

      .hero-subtitle {
        font-size: 1.02rem;
      }

      .card,
      .result-card {
        padding: 18px;
        border-radius: 20px;
      }

      .question-label {
        font-size: 1.1rem;
      }

      .question-text {
        font-size: 1.02rem;
      }

      .result-title {
        font-size: 1.45rem;
      }

      .result-summary {
        font-size: 0.98rem;
      }

      .type-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* ─── AUTH / PIN CODE (IMAGE 2 STYLE) ─── */
    .auth-wrap {
      max-width: 360px;
      margin: 10px auto 0;
      text-align: center;
    }

    .auth-graphic-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 24px 20px 20px;
      box-shadow: 0 12px 32px rgba(130, 78, 32, 0.08);
      margin: 16px auto 22px;
      border: 1px solid var(--border);
      max-width: 290px;
    }

    .auth-illustration {
      font-size: 3.6rem;
      line-height: 1;
      margin-bottom: 10px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .auth-title-tag {
      font-weight: 900;
      font-size: 1.15rem;
      color: var(--text-dark);
      letter-spacing: 1px;
    }

    .auth-subtag {
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--brand);
      text-transform: uppercase;
      margin-top: 4px;
    }

    .auth-prompt {
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 20px;
    }

    .pin-container {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 28px;
    }

    .pin-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2.5px solid #d8c2b0;
      background: transparent;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .pin-dot.filled {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
      transform: scale(1.2);
      box-shadow: 0 0 14px rgba(255, 127, 80, 0.45);
    }

    .pin-dot.error {
      background: #ff5252 !important;
      border-color: #ff5252 !important;
      box-shadow: 0 0 14px rgba(255, 82, 82, 0.5) !important;
    }

    .pin-container.shake {
      animation: shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      max-width: 320px;
      margin: 0 auto;
    }

    .keypad-btn {
      height: 58px;
      border-radius: 29px;
      border: none;
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(130, 78, 32, 0.08);
      font-size: 1.45rem;
      font-weight: 800;
      font-family: inherit;
      color: var(--text-dark);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .keypad-btn:hover {
      background: #fff8f0;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(130, 78, 32, 0.14);
    }

    .keypad-btn:active {
      transform: scale(0.92);
      background: #ffe8cc;
    }

    .keypad-btn.action-btn {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-mid);
      background: #faf4ed;
    }

    /* ─── HOME (IMAGE 1 STYLE) ───────────── */
    .venn-graphic {
      position: relative;
      width: 220px;
      height: 170px;
      margin: 14px auto 24px;
    }

    .venn-circle {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      mix-blend-mode: multiply;
      opacity: 0.72;
    }

    .venn-1 {
      top: 5px;
      left: 20px;
      background: #ff7b90;
    }

    .venn-2 {
      top: 5px;
      right: 20px;
      background: #7a9efe;
    }

    .venn-3 {
      bottom: 5px;
      left: 55px;
      background: #d88bf0;
    }

    .name-input-wrap {
      max-width: 380px;
      margin: 18px auto 16px;
      text-align: center;
    }

    .name-input-label {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 10px;
      display: block;
    }

    .name-input {
      width: 100%;
      height: 52px;
      border-radius: 16px;
      border: 2px solid var(--border);
      background: #fff;
      font-size: 1.05rem;
      font-family: inherit;
      font-weight: 700;
      color: var(--text-dark);
      text-align: center;
      padding: 0 16px;
      outline: none;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(130, 78, 32, 0.05);
    }

    .name-input:focus {
      border-color: var(--primary-dark);
      box-shadow: 0 0 0 4px rgba(255, 127, 80, 0.18);
    }

    .info-summary-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px 20px;
      max-width: 290px;
      margin: 16px auto 26px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(130, 78, 32, 0.05);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-mid);
    }

    .info-summary-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
  </style>
</head>

<body>
  <div class="container" id="app"></div>
  <div class="toast" id="toast"></div>

  <script>
    // ─── KAKAO SDK CONFIG ────────────────────────────────────────────────────────
    // 카카오 디벨로퍼스(https://developers.kakao.com) JavaScript 키 (직접 입력 또는 브라우저 입력 지원)
    const KAKAO_JAVASCRIPT_KEY = "";

    function getKakaoKey() {
      return KAKAO_JAVASCRIPT_KEY || localStorage.getItem("kakao_js_key") || "";
    }

    function initKakaoSDK() {
      const key = getKakaoKey();
      if (window.Kakao && key && !window.Kakao.isInitialized()) {
        try {
          window.Kakao.init(key);
        } catch (e) {
          console.warn("Kakao SDK init failed:", e);
        }
      }
    }
    initKakaoSDK();

    // ─── GOOGLE SHEET CONFIG ─────────────────────────────────────────────────────
    // 구글 스프레드시트 Apps Script 웹 앱 URL (배포 후 발급받은 URL)
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbxf39hJihNnUAvORbrwwMN1J77EpiUEXmhz1Htgs0SMNtCc30HxxehtJRY9VeL05ZR0/exec";

    function getGoogleSheetUrl() {
      return GOOGLE_SHEET_URL || localStorage.getItem("google_sheet_url") || "";
    }

    function saveResultToGoogleSheet(scores, primaryType, secondaryType) {
      const endpoint = getGoogleSheetUrl();
      if (!endpoint || state.savedToSheet) return;

      state.savedToSheet = true;

      const r1 = RESULTS[primaryType] || {};
      const r2 = RESULTS[secondaryType] || {};
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      const payload = {
        timestamp: new Date().toLocaleString("ko-KR", { timeZone: "Asia/Seoul" }),
        name: state.userName || "익명",
        primaryType: `${r1.name || primaryType} ${r1.emoji || ""}`.trim(),
        secondaryType: `${r2.name || secondaryType} ${r2.emoji || ""}`.trim(),
        scoreA: scores.A || 0,
        scoreB: scores.B || 0,
        scoreC: scores.C || 0,
        scoreD: scores.D || 0,
        device: isMobile ? "모바일" : "PC",
        responses: state.responses,
      };

      try {
        fetch(endpoint, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
        }).then(() => {
          console.log("구글 시트 저장 요청 완료");
          const badge = document.getElementById("sheet-saved-badge");
          if (badge) badge.style.display = "inline-block";
        }).catch(err => {
          console.warn("구글 시트 전송 실패:", err);
        });
      } catch (e) {
        console.warn("구글 시트 요청 오류:", e);
      }
    }

    // ─── DATA ────────────────────────────────────────────────────────────────────
    const SCALE = { 1: "전혀 아니다", 2: "아니다", 3: "보통이다", 4: "그렇다", 5: "매우 그렇다" };

    const QUESTIONS = [

    // ─── EVENTS ───────────────────────────────────────────────────────────────────
    function attachEvents() {
      // AUTH (참여코드 4자리 입력)
      if (state.page === "auth") {
        document.querySelectorAll(".keypad-btn[data-key]").forEach(btn => {
          btn.addEventListener("click", () => {
            inputPin(btn.dataset.key);
          });
        });

        const btnPinClear = document.getElementById("btn-pin-clear");
        if (btnPinClear) btnPinClear.addEventListener("click", clearPin);

        const btnPinDel = document.getElementById("btn-pin-del");
        if (btnPinDel) btnPinDel.addEventListener("click", deletePin);

        if (!window._authKeyHandlerAttached) {
          window._authKeyHandlerAttached = true;
          window.addEventListener("keydown", (e) => {
            if (state.page !== "auth") return;
            if (e.key >= "0" && e.key <= "9") {
              inputPin(e.key);
            } else if (e.key === "Backspace") {
              deletePin();
            } else if (e.key === "Escape") {
              clearPin();
            }
          });
        }
        return;
      }

      // HOME
      const btnStart = document.getElementById("btn-start");
      if (btnStart) {
        btnStart.addEventListener("click", () => {
          const nameInput = document.getElementById("user-name");
          if (nameInput) {
            const val = nameInput.value.trim();
            state.userName = val;
            if (val) localStorage.setItem("parent_test_name", val);
          }
          state.page = "test";
          state.currentQ = 0;
          render();
        });
      }

      const nameInput = document.getElementById("user-name");
      if (nameInput) {
        nameInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && btnStart) {
            btnStart.click();
          }
        });
      }

      // TEST – radio
      document.querySelectorAll(".radio-option").forEach(el => {
        el.addEventListener("click", () => {
          const q = QUESTIONS[state.currentQ];
          state.responses[q.id] = parseInt(el.dataset.value);
          document.querySelectorAll(".radio-option").forEach(o => o.classList.remove("selected"));
          el.classList.add("selected");
        });
      });

      const btnPrev = document.getElementById("btn-prev");
      if (btnPrev) btnPrev.addEventListener("click", () => {
        if (state.currentQ > 0) { state.currentQ--; render(); }
      });

      const btnNext = document.getElementById("btn-next");
      if (btnNext) btnNext.addEventListener("click", () => {
        const q = QUESTIONS[state.currentQ];
        if (!state.responses[q.id]) state.responses[q.id] = 3;
        if (state.currentQ < QUESTIONS.length - 1) {
          state.currentQ++; render();
        } else {
          state.page = "result"; render();
        }
      });

      // RESULT
      const btnHome = document.getElementById("btn-home");
      const btnRetry = document.getElementById("btn-retry");
      if (btnHome) btnHome.addEventListener("click", () => { resetState(); render(); });
      if (btnRetry) btnRetry.addEventListener("click", () => { resetState(); state.page = "test"; render(); });

      const btnCopy = document.getElementById("btn-copy");
      if (btnCopy) btnCopy.addEventListener("click", () => {
        const url = window.location.href.split("?")[0];
        copyToClipboard(url, "📋 링크가 복사되었습니다!");
      });

      const btnPdf = document.getElementById("btn-pdf");
      if (btnPdf) btnPdf.addEventListener("click", generatePDF);

      const btnKakao = document.getElementById("btn-kakao");
      if (btnKakao) btnKakao.addEventListener("click", async () => {
        const url = "https://kimchulhee9-ux.github.io/mvp/";
        const scores = calcScores();
        const type = analyzeType(scores);
        const r = RESULTS[type];
        const shareTitle = `[MVP 부모유형 진단] 나의 육아 유형은 "${r.name}" ${r.emoji}`;
        const shareDesc = `${r.summary}\n\n💬 추천 대화:\n${r.talk}`;
        const fullShareText = `${shareTitle}\n${shareDesc}\n\n👉 나도 진단해보기: ${url}`;

        // 1. 카카오 공식 JavaScript SDK (PC 및 모바일 모두 친구/대화방 선택창 호출)
        if (window.Kakao && window.Kakao.isInitialized()) {
          try {
            Kakao.Share.sendDefault({
              objectType: 'feed',
              content: {
                title: shareTitle,
                description: `${r.summary}\n\n💬 추천 대화: ${r.talk}`,
                imageUrl: 'https://kimchulhee9-ux.github.io/mvp/favicon.ico',
                link: {
                  mobileWebUrl: url,
                  webUrl: url,
                },
              },
              buttons: [
                {
                  title: '나도 테스트해보기',
                  link: {
                    mobileWebUrl: url,
                    webUrl: url,
                  },
                },
              ],
            });
            return;
          } catch (e) {
            console.error("Kakao SDK share error:", e);
          }
        }

        // 2. 모바일 브라우저 환경 (Web Share API 지원 시 개별 카카오톡 친구/방 선택 가능)
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (navigator.share && isMobile) {
          try {
            await navigator.share({
              title: "MVP 부모유형 진단",
              text: fullShareText,
              url: url,
            });
            return;
          } catch (e) {
            if (e.name === "AbortError") return;
          }
        }

        // 3. 카카오 키가 미설정된 경우: 키 입력 프롬프트 안내
        if (window.Kakao && !window.Kakao.isInitialized()) {
          const userKey = prompt(
            "카카오톡 친구/대화방 직접 전송을 위해 카카오 JavaScript 키가 필요합니다.\n\n카카오 디벨로퍼스(developers.kakao.com)의 JavaScript 키를 입력해주세요:\n(취소 시 결과 전문과 링크가 복사되어 카카오톡에 바로 붙여넣기 할 수 있습니다.)"
          );
          if (userKey && userKey.trim()) {
            localStorage.setItem("kakao_js_key", userKey.trim());
            try {
              window.Kakao.init(userKey.trim());
              btnKakao.click();
              return;
            } catch (err) {
              alert("카카오 JavaScript 키 초기화에 실패했습니다. 키를 확인해주세요.");
            }
          }
        }

        // 4. 폴백: 결과 내용 및 링크 복사
        copyToClipboard(fullShareText, "📋 결과와 링크가 복사되었습니다! 카카오톡 대화방에 붙여넣기(Ctrl+V) 하세요.");
      });

      // 구글 시트 연동 설정 버튼
      const btnSheetSetting = document.getElementById("btn-sheet-setting");
      if (btnSheetSetting) {
        btnSheetSetting.addEventListener("click", () => {
          const currentUrl = getGoogleSheetUrl();
          const input = prompt(
            "구글 스프레드시트 Apps Script 웹 앱 URL을 입력하세요:\n(예: https://script.google.com/macros/s/.../exec)\n\n※ 빈칸으로 두고 확인을 누르면 저장된 설정이 삭제됩니다.",
            currentUrl
          );
          if (input !== null) {
            if (input.trim()) {
              localStorage.setItem("google_sheet_url", input.trim());
              showToast("📊 구글 시트 연동 URL이 저장되었습니다!");
              if (state.page === "result" && !state.savedToSheet) {
                const scores = calcScores();
                const type = analyzeType(scores);
                const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
                const secondType = sorted[1][0] !== type ? sorted[1][0] : sorted[0][0];
                saveResultToGoogleSheet(scores, type, secondType);
              }
            } else {
              localStorage.removeItem("google_sheet_url");
              showToast("구글 시트 연동 설정이 초기화되었습니다.");
            }
          }
        });
      }
    }

    function resetState() {
      state.page = "home"; state.responses = {}; state.currentQ = 0; state.savedToSheet = false;
    }

    // ─── TOAST ───────────────────────────────────────────────────────────────────
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    function copyToClipboard(text, successToast = "📋 링크가 복사되었습니다!") {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(successToast)).catch(() => {
          fallbackClipboard(text, successToast);
        });
      } else {
        fallbackClipboard(text, successToast);
      }
    }

    function fallbackClipboard(text, successToast) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      ta.style.top = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        showToast(successToast);
      } catch (e) {
        showToast("❌ 복사에 실패했습니다.");
      }
      document.body.removeChild(ta);
    }

    // ─── PDF ─────────────────────────────────────────────────────────────────────
    async function generatePDF() {
      const btnPdf = document.getElementById("btn-pdf");
      if (btnPdf) { btnPdf.disabled = true; btnPdf.textContent = "⏳ PDF 생성 중..."; }

      try {
        const appEl = document.getElementById("app");
        const canvas = await html2canvas(appEl, {
          scale: 2,
          useCORS: true,
          backgroundColor: "#fff8ef",
          scrollX: 0,
          scrollY: -window.scrollY,
        });

        const imgData = canvas.toDataURL("image/png");
        const { jsPDF } = window.jspdf;

        const pdfW = 210;
        const pdfH = (canvas.height / canvas.width) * pdfW;
        const pageH = 297;

        const doc = new jsPDF("p", "mm", "a4");

        if (pdfH <= pageH) {
          doc.addImage(imgData, "PNG", 0, 0, pdfW, pdfH);
        } else {
          let drawnH = 0;
          while (drawnH < pdfH) {
            doc.addImage(imgData, "PNG", 0, -drawnH, pdfW, pdfH);
            drawnH += pageH;
            if (drawnH < pdfH) doc.addPage();
          }
        }

        // 모바일 감지: 삼성/iOS 등 모바일에서는 새 탭으로 열어서 저장 유도
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (isMobile) {
          const blob = doc.output("blob");
          const blobUrl = URL.createObjectURL(blob);
          // 새 탭으로 열기 → 브라우저 PDF 뷰어에서 저장 버튼 사용
          const newTab = window.open(blobUrl, "_blank");
          if (!newTab) {
            // 팝업 차단된 경우 → a 태그 다운로드 시도
            const a = document.createElement("a");
            a.href = blobUrl;
            a.download = "부모유형진단_결과.pdf";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          }
          showToast("📄 PDF를 열었습니다! 화면 상단 저장 버튼을 눌러 저장하세요.");
        } else {
          doc.save("부모유형진단_결과.pdf");
          showToast("📄 PDF가 저장되었습니다!");
        }
      } catch (e) {
        console.error(e);
        showToast("❌ PDF 생성에 실패했습니다. 다시 시도해주세요.");
      } finally {
        if (btnPdf) { btnPdf.disabled = false; btnPdf.textContent = "📄 결과 PDF 저장"; }
      }
    }

    // ─── INIT ─────────────────────────────────────────────────────────────────────
    render();
  </script>
</body>
